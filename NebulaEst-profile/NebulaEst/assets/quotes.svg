<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="Motto hidup">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12072a"/><stop offset="1" stop-color="#1c0f3d"/></linearGradient>
<linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
<rect width="900" height="170" rx="16" fill="url(#g)"/>
<rect x="1" y="1" width="898" height="168" rx="16" fill="none" stroke="#a855f7" stroke-opacity="0.35"/>
<rect x="28" y="30" width="4" height="110" rx="2" fill="url(#l)"/>
<text x="52" y="62" font-family="Georgia,serif" font-size="64" fill="#a855f7" fill-opacity="0.35">“</text>
<g opacity="1"><animate attributeName="opacity" dur="48.0s" repeatCount="indefinite" keyTimes="0;0.1146;0.1250;1" values="1;1;0;0"/><text x="80" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">Aku bertarung bukan karena aku ingin menang, tetapi aku</text><text x="80" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">bertarung karena aku harus menang.</text><text x="80" y="136" font-family="'Courier New',monospace" font-size="15" fill="#a855f7">— Ichigo Kurosaki · Bleach</text></g>
<g opacity="0"><animate attributeName="opacity" dur="48.0s" repeatCount="indefinite" keyTimes="0;0.1250;0.1354;0.2396;0.2500;1" values="0;0;1;1;0;0"/><text x="80" y="78" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">Bagaimana kau bisa maju jika kau terus menyesali masa lalu.</text><text x="80" y="136" font-family="'Courier New',monospace" font-size="15" fill="#a855f7">— Edward Elric · Fullmetal Alchemist</text></g>
<g opacity="0"><animate attributeName="opacity" dur="48.0s" repeatCount="indefinite" keyTimes="0;0.2500;0.2604;0.3646;0.3750;1" values="0;0;1;1;0;0"/><text x="80" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">Mimpi tidak berarti apa-apa jika kau tidak menggapainya dengan</text><text x="80" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">tanganmu sendiri.</text><text x="80" y="136" font-family="'Courier New',monospace" font-size="15" fill="#a855f7">— Jin Mori · The God of High School</text></g>
<g opacity="0"><animate attributeName="opacity" dur="48.0s" repeatCount="indefinite" keyTimes="0;0.3750;0.3854;0.4896;0.5000;1" values="0;0;1;1;0;0"/><text x="80" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">Kita mungkin tidak dapat memilih bagaimana kita mati, tapi</text><text x="80" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">kita bisa memutuskan bagaimana kita hidup.</text><text x="80" y="136" font-family="'Courier New',monospace" font-size="15" fill="#a855f7">— Clare · Claymore</text></g>
<g opacity="0"><animate attributeName="opacity" dur="48.0s" repeatCount="indefinite" keyTimes="0;0.5000;0.5104;0.6146;0.6250;1" values="0;0;1;1;0;0"/><text x="80" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">Mula-mula, kau harus mengubah dirimu sendiri atau tidak akan</text><text x="80" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">ada yang berubah untukmu.</text><text x="80" y="136" font-family="'Courier New',monospace" font-size="15" fill="#a855f7">— Sakata Gintoki · Gintama</text></g>
<g opacity="0"><animate attributeName="opacity" dur="48.0s" repeatCount="indefinite" keyTimes="0;0.6250;0.6354;0.7396;0.7500;1" values="0;0;1;1;0;0"/><text x="80" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">Manusia itu kuat karena memiliki kemampuan untuk mengubah</text><text x="80" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">dirinya sendiri.</text><text x="80" y="136" font-family="'Courier New',monospace" font-size="15" fill="#a855f7">— Saitama · One Punch Man</text></g>
<g opacity="0"><animate attributeName="opacity" dur="48.0s" repeatCount="indefinite" keyTimes="0;0.7500;0.7604;0.8646;0.8750;1" values="0;0;1;1;0;0"/><text x="80" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">Jangan khawatirkan apa yang dipikirkan orang lain. Tegakkan</text><text x="80" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">kepalamu dan melangkahlah ke depan.</text><text x="80" y="136" font-family="'Courier New',monospace" font-size="15" fill="#a855f7">— Izuku Midoriya · My Hero Academia</text></g>
<g opacity="0"><animate attributeName="opacity" dur="48.0s" repeatCount="indefinite" keyTimes="0;0.8750;0.8854;1" values="0;0;1;1"/><text x="80" y="78" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-style="italic" fill="#ede9fe">Selama aku masih bernapas... aku tak akan pernah menyerah.</text><text x="80" y="136" font-family="'Courier New',monospace" font-size="15" fill="#a855f7">— Natsu Dragneel · Fairy Tail</text></g>
</svg>